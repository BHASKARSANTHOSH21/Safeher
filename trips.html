<!DOCTYPE html>
<html>
<head>
    <title>Trips</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">
            SafeHer - Trips
        </span>
    </div>
</nav>

<div class="container mt-5">

<div class="card p-4">

<h2>Create Trip</h2>

<form method="POST">

<select name="passenger" class="form-control mb-3" required>

<option value="">Select Passenger</option>

{% for p in passengers %}
<option value="{{ p[0] }}">{{ p[1] }}</option>
{% endfor %}

</select>

<select name="driver" class="form-control mb-3" required>

<option value="">Select Driver</option>

{% for d in drivers %}
<option value="{{ d[0] }}">{{ d[1] }}</option>
{% endfor %}

</select>

<select name="vehicle" class="form-control mb-3" required>

<option value="">Select Vehicle</option>

{% for v in vehicles %}
<option value="{{ v[0] }}">{{ v[1] }}</option>
{% endfor %}

</select>

<input type="text" name="start" class="form-control mb-3" placeholder="Start Location" required>

<input type="text" name="end" class="form-control mb-3" placeholder="End Location" required>

<button type="submit" class="btn btn-primary">
Start Trip
</button>

</form>

</div>

<br>

<h3>Trip History</h3>

<table class="table table-bordered table-striped">

<tr>
<th>Trip ID</th>
<th>Passenger</th>
<th>Driver</th>
<th>Vehicle</th>
<th>Start</th>
<th>End</th>
<th>Status</th>
</tr>

{% for t in trips %}

<tr>
<td>{{ t[0] }}</td>
<td>{{ t[1] }}</td>
<td>{{ t[2] }}</td>
<td>{{ t[3] }}</td>
<td>{{ t[4] }}</td>
<td>{{ t[5] }}</td>
<td>{{ t[6] }}</td>
</tr>

{% endfor %}

</table>

<a href="/dashboard" class="btn btn-secondary">
Back to Dashboard
</a>

</div>

</body>
</html>
