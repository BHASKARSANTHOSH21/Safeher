<!DOCTYPE html>
<html>
<head>
    <title>SafeHer Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fa;
        }

        .register-box{
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.1);
            margin-top:60px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">
            SafeHer - Women Safety Monitoring System
        </span>
    </div>
</nav>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="register-box">

                <h2 class="text-center mb-4">
                    User Registration
                </h2>

                <form method="POST">

                    <div class="mb-3">
                        <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter Full Name"
                        required>
                    </div>

                    <div class="mb-3">
                        <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter Email"
                        required>
                    </div>

                    <div class="mb-3">
                        <input
                        type="text"
                        name="phone"
                        class="form-control"
                        placeholder="Enter Phone Number"
                        required>
                    </div>

                    <div class="mb-3">
                        <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Create Password"
                        required>
                    </div>

                    <button
                    type="submit"
                    class="btn btn-primary w-100">
                        Register
                    </button>

                </form>

                <div class="text-center mt-3">
                    <a href="/login">
                        Already have an account? Login
                    </a>
                </div>

            </div>

        </div>

    </div>

</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
    SafeHer Women Safety Monitoring System © 2026
</footer>

</body>
</html>
