<!DOCTYPE html>
<html>
<head>
    <title>Passengers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">
            SafeHer - Passengers
        </span>
    </div>
</nav>

<div class="container mt-5">

    <div class="card p-4">

        <h2>Add Passenger</h2>

        <form method="POST">

            <input type="text" name="name" class="form-control mb-3" placeholder="Passenger Name" required>

            <input type="text" name="phone" class="form-control mb-3" placeholder="Phone Number" required>

            <input type="email" name="email" class="form-control mb-3" placeholder="Email Address" required>

            <input type="text" name="emergency" class="form-control mb-3" placeholder="Emergency Contact" required>

            <button type="submit" class="btn btn-success">
                Add Passenger
            </button>

        </form>

    </div>

    <br>

    <a href="/dashboard" class="btn btn-secondary">
        Back to Dashboard
    </a>

</div>

</body>
</html>
