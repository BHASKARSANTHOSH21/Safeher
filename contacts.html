<!DOCTYPE html>
<html>
<head>
    <title>Emergency Contacts</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .contact-card{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.1);
        }

        .table-box{
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.1);
        }

        .page-title{
            color:#dc3545;
            font-weight:bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">
            SafeHer - Emergency Contacts
        </span>
    </div>
</nav>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-5">

            <div class="contact-card">

                <h3 class="page-title mb-4">
                    Add Emergency Contact
                </h3>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">
                            Contact Name
                        </label>

                        <input
                        type="text"
                        name="contact_name"
                        class="form-control"
                        placeholder="Enter Contact Name"
                        required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Contact Phone
                        </label>

                        <input
                        type="text"
                        name="contact_phone"
                        class="form-control"
                        placeholder="Enter Phone Number"
                        required>
                    </div>

                    <button
                    type="submit"
                    class="btn btn-danger w-100">
                        Save Contact
                    </button>

                </form>

            </div>

        </div>

        <div class="col-md-7">

            <div class="table-box">

                <h3 class="mb-4">
                    Saved Emergency Contacts
                </h3>

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                        <tr>
                            <th>Name</th>
                            <th>Phone Number</th>
                        </tr>

                    </thead>

                    <tbody>

                        {% for contact in contacts %}

                        <tr>
                            <td>{{ contact[0] }}</td>
                            <td>{{ contact[1] }}</td>
                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <div class="text-center mt-4">

        <a href="/dashboard" class="btn btn-secondary">
            Back to Dashboard
        </a>

    </div>

</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
    SafeHer Women Safety Monitoring System © 2026
</footer>

</body>
</html>
