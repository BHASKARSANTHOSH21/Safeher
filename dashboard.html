<!DOCTYPE html>
<html>
<head>
    <title>SafeHer Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fa;
        }

        .card-box{
            padding:30px;
            text-align:center;
            border-radius:15px;
            color:white;
            font-size:20px;
            font-weight:bold;
            text-decoration:none;
            display:block;
        }

        .welcome-box{
            background:white;
            padding:20px;
            border-radius:15px;
            margin-bottom:30px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }

        .sos-btn{
            width:100%;
            font-size:28px;
            padding:20px;
            border-radius:15px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            SafeHer - Women Safety Monitoring System
        </span>
    </div>
</nav>

<div class="container mt-4">

    <div class="welcome-box">
        <h2>Welcome {{ name }}</h2>
        <p>Women Safety Monitoring Dashboard</p>
    </div>

    <div class="row">

        <div class="col-md-4 mb-4">
            <a href="/contacts" class="card-box bg-primary">
                Emergency Contacts
            </a>
        </div>

        <div class="col-md-4 mb-4">
            <a href="/passengers" class="card-box bg-success">
                Passengers
            </a>
        </div>

        <div class="col-md-4 mb-4">
            <a href="/drivers" class="card-box bg-warning text-dark">
                Drivers
            </a>
        </div>

        <div class="col-md-4 mb-4">
            <a href="/trips" class="card-box bg-info text-dark">
                Trips
            </a>
        </div>

        <div class="col-md-4 mb-4">
            <a href="/complaints" class="card-box bg-secondary">
                Complaints
            </a>
        </div>

        <div class="col-md-4 mb-4">
            <a href="/alerts" class="card-box bg-dark">
                Alerts
            </a>
        </div>

    </div>

    <div class="row mt-4">
        <div class="col-md-12">

            <a href="/sos">
                <button class="btn btn-danger sos-btn">
                    🚨 SEND SOS ALERT
                </button>
            </a>

        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-12 text-center">

            <a href="/logout" class="btn btn-outline-danger">
                Logout
            </a>

        </div>
    </div>

</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
    SafeHer Women Safety Monitoring System © 2026
</footer>

</body>
</html>
