<!DOCTYPE html>
<html>
<head>
    <title>Complaints</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">
            SafeHer - Complaints
        </span>
    </div>
</nav>

<div class="container mt-5">

<div class="card p-4">

<h2>Submit Complaint</h2>

<form method="POST">

<select name="passenger" class="form-control mb-3" required>

<option value="">Select Passenger</option>

{% for p in passengers %}
<option value="{{ p[0] }}">{{ p[1] }}</option>
{% endfor %}

</select>

<select name="driver" class="form-control mb-3" required>

<option value="">Select Driver</option>

{% for d in drivers %}
<option value="{{ d[0] }}">{{ d[1] }}</option>
{% endfor %}

</select>

<select name="trip" class="form-control mb-3" required>

<option value="">Select Trip</option>

{% for t in trips %}
<option value="{{ t[0] }}">Trip {{ t[0] }}</option>
{% endfor %}

</select>

<textarea name="text" class="form-control mb-3" rows="4" placeholder="Enter Complaint" required></textarea>

<button type="submit" class="btn btn-danger">
Submit Complaint
</button>

</form>

</div>

<br>

<a href="/dashboard" class="btn btn-secondary">
Back to Dashboard
</a>

</div>

</body>
</html>
